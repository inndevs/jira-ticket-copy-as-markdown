<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jira to Markdown — store promotional tile</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172b4d; background: #f5f8ff; }
    * { box-sizing: border-box; }
    body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    .canvas { position: relative; width: 100%; height: 100%; padding: 17px 25px; background: radial-gradient(ellipse at 100% 0%, #e2edff 0%, transparent 62%); }
    .brand { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: -.25px; }
    .brand img { width: 26px; height: 26px; margin-left: -3px; }
    .flow { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 26px; height: 52px; }
    .jira { width: 110px; height: 43px; object-fit: contain; }
    .arrow { width: 31px; height: 23px; color: #8999b0; }
    .markdown { display: grid; place-items: center; width: 94px; height: 51px; border: 3px solid #172b4d; border-radius: 7px; color: #172b4d; font-size: 28px; font-weight: 800; letter-spacing: -2.5px; padding-right: 4px; line-height: 1; }
    h1 { margin: 26px 0 0; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; font-weight: 750; }
    h1 span { display: block; color: #1262ed; }
    .tagline { margin: 12px 0 0; font-size: 12px; line-height: 1.3; color: #5a6f8c; }
    .maker { position: absolute; right: 27px; bottom: 18px; margin: 0; font-size: 9px; font-weight: 700; letter-spacing: .15px; color: #7d8ea7; }
  </style>
</head>
<body data-asset="promo">
  <main class="canvas">
    <div class="brand" data-fit><img src="../icons/icon128.png" alt="">Jira to Markdown</div>
    <div class="flow" data-fit><img class="jira" src="assets/jira-logo.svg" alt="Jira"><svg class="arrow" viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h26m-8-8 8 8-8 8"/></svg><span class="markdown" aria-label="Markdown">M↓</span></div>
    <h1 data-fit>Copy Jira.<span>Paste Markdown.</span></h1>
    <p class="tagline" data-fit>One click. All the context.</p>
    <p class="maker" data-fit>inndevs</p>
  </main>
</body>
</html>
