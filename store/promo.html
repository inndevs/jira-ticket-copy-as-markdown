<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jira to Markdown — store promotional tile</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #10203d; background: #f0f5ff; }
    * { box-sizing: border-box; }
    body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    .canvas { position: relative; width: 100%; height: 100%; padding: 22px 28px; background: radial-gradient(ellipse at 95% 0%, #d5e4ff 0%, transparent 58%), radial-gradient(ellipse at 0% 100%, #e0eaff 0%, transparent 55%); }
    .brand { display: flex; align-items: center; gap: 7px; height: 44px; margin-left: -6px; font-size: 16px; font-weight: 700; letter-spacing: -.45px; }
    .brand img { width: 44px; height: 44px; }
    h1 { margin: 23px 0 0; font-size: 43px; line-height: 1.08; letter-spacing: -2px; font-weight: 750; }
    h1 span { display: block; color: #1262ed; }
    .tagline { margin: 19px 0 0; font-size: 15px; line-height: 1.4; letter-spacing: -.15px; color: #566782; }
    .maker { position: absolute; right: 29px; bottom: 19px; margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .2px; color: #7085a6; }
  </style>
</head>
<body data-asset="promo">
  <main class="canvas">
    <div class="brand" data-fit><img src="../icons/icon128.png" alt="">Jira to Markdown</div>
    <h1 data-fit>Copy Jira.<span>Paste Markdown.</span></h1>
    <p class="tagline" data-fit>One click. All the context.</p>
    <p class="maker" data-fit>inndevs</p>
  </main>
</body>
</html>
